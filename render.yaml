services:
  - type: web
    name: employee-operations-lab
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SPLUNK_HEC_URL
        sync: false
      - key: SPLUNK_HEC_TOKEN
        sync: false
      - key: SPLUNK_INDEX
        value: "employee_app"
      - key: SPLUNK_SOURCE
        value: "employee-cloud-demo"
      - key: SPLUNK_SOURCETYPE
        value: "_json"
      - key: SPLUNK_VERIFY_SSL
        value: "true"
